name: FlowBridge
options:
  bundleIdPrefix: com.marcomilanello
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  FlowBridgeShared:
    type: framework
    platform: iOS
    sources:
      - path: Sources/FlowBridgeShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcomilanello.flowbridge.shared
        APPLICATION_EXTENSION_API_ONLY: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
  FlowBridgeApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/FlowBridgeApp
      - path: Sources/FlowBridgeAppIntents
    dependencies:
      - target: FlowBridgeShared
      - target: FlowBridgeKeyboard
      - target: FlowBridgeShareExtension
      - target: FlowBridgeWidgets
    entitlements:
      path: Entitlements/FlowBridgeApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.marcomilanello.flowbridge
    info:
      path: Configuration/FlowBridgeApp-Info.plist
      properties:
        CFBundleDisplayName: FlowBridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: FlowBridge records only when you start a dictation or a meeting; the audio is uploaded for transcription when you stop.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Senza questa chiave iOS disegna l'app scalata, non a risoluzione nativa.
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: com.marcomilanello.flowbridge
            CFBundleURLSchemes:
              - flowbridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcomilanello.flowbridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Gli intent sono compilati anche nel widget, dove ForegroundContinuableIntent non esiste.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FLOWBRIDGE_MAIN_APP"
  FlowBridgeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/FlowBridgeKeyboard
    dependencies:
      - target: FlowBridgeShared
    entitlements:
      path: Entitlements/FlowBridgeKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.marcomilanello.flowbridge
    info:
      path: Configuration/FlowBridgeKeyboard-Info.plist
      properties:
        CFBundleDisplayName: FlowBridge Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcomilanello.flowbridge.keyboard
  FlowBridgeShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/FlowBridgeShareExtension
    dependencies:
      - target: FlowBridgeShared
    entitlements:
      path: Entitlements/FlowBridgeShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.marcomilanello.flowbridge
    info:
      path: Configuration/FlowBridgeShareExtension-Info.plist
      properties:
        CFBundleDisplayName: FlowBridge Import
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsAudioWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcomilanello.flowbridge.share
  FlowBridgeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/FlowBridgeWidgets
      - path: Sources/FlowBridgeAppIntents
    dependencies:
      - target: FlowBridgeShared
    entitlements:
      path: Entitlements/FlowBridgeWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.marcomilanello.flowbridge
    info:
      path: Configuration/FlowBridgeWidgets-Info.plist
      properties:
        CFBundleDisplayName: FlowBridge Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcomilanello.flowbridge.widgets
  FlowBridgeSharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FlowBridgeSharedTests
    dependencies:
      - target: FlowBridgeShared
