name: FlowBridge
options:
  bundleIdPrefix: com.marcomilanello
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "U4V6QDV8A5"
packages:
  ArgmaxOSSSwift:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: "1.0.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    # Pinned: v0.15.5 is the last dependency-free release (main adds a
    # binary xcframework for TTS we don't use).
    exactVersion: "0.15.5"
targets:
  FlowBridgeShared:
    type: framework
    platform: iOS
    sources:
      - path: Sources/FlowBridgeShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcomilanello.flowbridge.shared
        APPLICATION_EXTENSION_API_ONLY: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
  FlowBridgeApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/FlowBridgeApp
      - path: Sources/FlowBridgeAppIntents
      # Resources live under `sources` — XcodeGen has no target-level
      # `resources` key and silently ignores it (that mistake kept both the
      # asset catalog and the Whisper model out of the bundle). XcodeGen
      # sorts each entry into the right build phase automatically.
      - path: Resources/Assets.xcassets
      # Folder references: contents are copied verbatim at build time, so the
      # Whisper model fetched after `xcodegen generate` still lands in the bundle.
      - path: Resources/WhisperModels
        type: folder
        optional: true
      - path: Resources/Benchmark
        type: folder
        optional: true
      # Diarization CoreML models (scripts/fetch-diarization-models.sh);
      # folder reference so the compiled .mlmodelc bundles copy verbatim.
      - path: Resources/DiarizationModels
        type: folder
        optional: true
    dependencies:
      - target: FlowBridgeShared
      - package: ArgmaxOSSSwift
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
      - target: FlowBridgeKeyboard
      - target: FlowBridgeShareExtension
      - target: FlowBridgeWidgets
    entitlements:
      path: Entitlements/FlowBridgeApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.marcomilanello.flowbridge
    info:
      path: Configuration/FlowBridgeApp-Info.plist
      properties:
        CFBundleDisplayName: FlowBridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: FlowBridge records speech locally and transcribes it on this device.
        # AI Action Bar: write-only calendar (the app never reads the agenda)
        # and reminders, requested only when the user taps a suggestion.
        NSCalendarsWriteOnlyAccessUsageDescription: FlowBridge adds calendar events you dictate — only when you tap the suggestion.
        NSRemindersFullAccessUsageDescription: FlowBridge creates reminders you dictate — only when you tap the suggestion.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Without this key iOS treats the app as legacy and renders it
        # scaled/letterboxed instead of native resolution.
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: com.marcomilanello.flowbridge
            CFBundleURLSchemes:
              - flowbridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcomilanello.flowbridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  FlowBridgeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/FlowBridgeKeyboard
    dependencies:
      - target: FlowBridgeShared
    entitlements:
      path: Entitlements/FlowBridgeKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.marcomilanello.flowbridge
    info:
      path: Configuration/FlowBridgeKeyboard-Info.plist
      properties:
        CFBundleDisplayName: FlowBridge Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcomilanello.flowbridge.keyboard
  FlowBridgeShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/FlowBridgeShareExtension
    dependencies:
      - target: FlowBridgeShared
    entitlements:
      path: Entitlements/FlowBridgeShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.marcomilanello.flowbridge
    info:
      path: Configuration/FlowBridgeShareExtension-Info.plist
      properties:
        CFBundleDisplayName: FlowBridge Import
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsAudioWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcomilanello.flowbridge.share
  FlowBridgeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/FlowBridgeWidgets
      - path: Sources/FlowBridgeAppIntents
    dependencies:
      - target: FlowBridgeShared
    entitlements:
      path: Entitlements/FlowBridgeWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.marcomilanello.flowbridge
    info:
      path: Configuration/FlowBridgeWidgets-Info.plist
      properties:
        CFBundleDisplayName: FlowBridge Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcomilanello.flowbridge.widgets
        # Marks the shared AppIntents sources as compiling inside an app
        # extension, where ForegroundContinuableIntent is unavailable.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FLOWBRIDGE_EXTENSION
  FlowBridgeSharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FlowBridgeSharedTests
    dependencies:
      - target: FlowBridgeShared
schemes:
  FlowBridgeApp:
    build:
      targets:
        FlowBridgeApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FlowBridgeSharedTests
