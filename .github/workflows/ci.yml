name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast cross-platform gate: builds the shared framework, runs the XCTest
  # suite and the runtime checks. Catches logic and Swift 6 strict-concurrency
  # regressions in minutes, no Mac required.
  shared-linux:
    runs-on: ubuntu-24.04
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Build shared framework
        run: swift build
      - name: Run shared tests
        run: swift test

  # Regenerates the Xcode project and compiles every target for the
  # simulator, unsigned. Device testing stays a manual gate.
  ios-simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build all iOS targets (simulator, unsigned)
        run: |
          xcodebuild build \
            -project FlowBridge.xcodeproj \
            -scheme FlowBridgeApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
